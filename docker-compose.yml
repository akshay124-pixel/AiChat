# ─────────────────────────────────────────────────────────────────────────────
# AI Chat — VPS backend
#
# What runs here:   FastAPI + Uvicorn (Docker container)
# What does NOT run here: Ollama — it runs on the VPS HOST, outside Docker
#
# The container reaches host Ollama via the special DNS name
# "host.docker.internal" which Docker maps to the host's gateway IP.
# This is enabled by the extra_hosts entry below.
#
# Usage on VPS:
#   cp .env.example .env        # fill in CORS_ORIGINS with your Vercel URL
#   docker compose up -d --build
#   curl http://127.0.0.1:8000/api/health
# ─────────────────────────────────────────────────────────────────────────────

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # Bind ONLY to localhost — nginx on the host proxies public traffic here.
    # Change to "0.0.0.0:8000:8000" only if you have no nginx and want direct
    # public access (not recommended for production).
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    # This makes "host.docker.internal" resolve to the host machine's IP.
    # Required so the container can reach Ollama running on the VPS host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
